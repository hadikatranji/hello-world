# Upstream definitions with keepalive
upstream odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}
upstream odoochat {
    server 127.0.0.1:8072;
    keepalive 16;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ""        close;
}

# 1) Redirect all HTTP to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name newerp.okdistribution.com;
    return      301 https://$host$request_uri;
}

# 2) HTTPS proxy to Odoo
server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         newerp.okdistribution.com;

    # Logs
    access_log          /var/log/nginx/odoo_access.log;
    error_log           /var/log/nginx/odoo_error.log warn;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/newerp.okdistribution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newerp.okdistribution.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (modified for Chrome compatibility)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Remove X-Frame-Options for Odoo compatibility, use CSP instead
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Client limits and compression
    client_max_body_size 50m;
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;
    gzip_min_length     256;
    gzip_types          text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/x-javascript;

    # Performance tuning: timeouts and buffers
    proxy_connect_timeout       3600s;
    proxy_send_timeout          3600s;
    proxy_read_timeout          3600s;
    proxy_buffer_size           128k;
    proxy_buffers               4 256k;
    proxy_busy_buffers_size     256k;
    proxy_temp_file_write_size  256k;

    # Common proxy headers
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      X-Forwarded-Host  $host;
    proxy_set_header      X-Forwarded-Port  $server_port;

    # 2a) Bus worker script and websocket worker bundle - CRITICAL FIX
    location ~* ^/bus/websocket_worker_bundle {
        proxy_pass            http://odoo;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        # Force correct MIME type for JavaScript
        add_header            Content-Type "application/javascript" always;
        # Disable caching for worker scripts
        add_header            Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header            Pragma "no-cache" always;
        add_header            Expires "0" always;
    }

    # 2b) General bus endpoints
    location ^~ /bus/ {
        proxy_pass            http://odoo;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    # 2c) Cache and serve static assets (CSS/JS/images) - IMPROVED
    location ~* ^/web/(?:static|assets)/ {
        proxy_pass          http://odoo;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        
        # Better caching headers
        expires             90d;
        add_header          Cache-Control "public, immutable" always;
        add_header          Vary "Accept-Encoding" always;
        
        # Handle missing assets gracefully
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    # 2d) CSS/JS file extensions with proper MIME types
    location ~* \.(css|js)$ {
        proxy_pass          http://odoo;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        
        # Ensure correct MIME types
        location ~* \.css$ {
            add_header Content-Type "text/css" always;
        }
        location ~* \.js$ {
            add_header Content-Type "application/javascript" always;
        }
        
        expires             90d;
        add_header          Cache-Control "public" always;
    }

    # 2e) Longpolling / WebSocket for real-time updates - ENHANCED
    location /longpolling {
        proxy_pass            http://odoochat;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        
        # Buffering
        proxy_buffering       off;
        proxy_cache           off;
    }

    # 2f) Fallback for missing assets
    location @fallback {
        proxy_pass            http://odoo;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    # 2g) Main Odoo application
    location / {
        proxy_pass            http://odoo;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Forwarded-Host  $host;
        proxy_set_header      X-Forwarded-Port  $server_port;
        
        # Handle large uploads
        proxy_request_buffering off;
    }
}